# System-wide tmux configuration for Hive workspaces.
# tmux reads /etc/tmux.conf before ~/.tmux.conf, so this applies to every
# user and every socket (including the `-L web` socket used by the terminal
# proxy). Per-user ~/.tmux.conf can still override settings below.

# Keep scrollback in the running tmux server; Hive does not save it to disk.
set -g history-limit 50000

# Hive web terminal sends F12 for Ctrl+Shift+M / Cmd+Shift+M. Keep the tmux
# binding on a neutral key so browser shortcuts do not collide with Enter.
bind-key -n F12 display-menu -T '#S:#W' \
  'Copy mode' c 'copy-mode' \
  'Choose tree' t 'choose-tree -Zw' \
  '' \
  'Split horizontal' h 'split-window -h' \
  'Split vertical' v 'split-window -v' \
  'New window' n 'new-window' \
  'Rename window' r 'command-prompt -I "#W" "rename-window -- %%"' \
  '' \
  'Kill pane' x 'confirm-before -p "kill-pane #P? (y/n)" kill-pane'
