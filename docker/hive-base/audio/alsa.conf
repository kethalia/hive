# Codex preserves PULSE_SERVER for its native voice helper. Each Hive terminal
# supplies a private server with a virtual microphone and speaker. Standalone
# applications can still use their normal PulseAudio server.
pcm.!default {
    type pulse
    hint {
        show on
        description "Hive browser audio"
    }
}
ctl.!default {
    type pulse
}
