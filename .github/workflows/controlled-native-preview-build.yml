# Invoke from a separately enrolled caller using a literal reviewed commit SHA.
# A completed run is required before the separate publisher can obtain a grant.
name: Controlled native Preview artifact build
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloudflare
      - name: Bundle bytes without uploading
        run: pnpm exec wrangler versions upload --dry-run --config deploy/cloudflare/native/wrangler.jsonc --outdir "$GITHUB_WORKSPACE/build/app"
      - run: node scripts/release/pack-build.mjs
        env:
          HIVE_RELEASE_TOPOLOGY: single
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-native-release
          path: release.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
