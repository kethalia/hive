name: Build hive-base Docker image

on:
  push:
    branches:
      - main
    paths:
      - "docker/hive-base/**"
      - ".github/workflows/build-base-image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docker/hive-base/**"
      - ".github/workflows/build-base-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: build-hive-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-push:
    name: Build, smoke test, and push hive-base image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally on all runs (load: true) so smoke tests run against the
      # exact image before anything is pushed to the registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker/hive-base
          push: false
          load: true
          platforms: linux/amd64
          tags: ghcr.io/kethalia/hive-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — claude --version
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} claude --version

      - name: Smoke test — notesmd-cli --version
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} notesmd-cli --version

      - name: Smoke test — act --version
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} act --version

      - name: Smoke test — vncserver present
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} which vncserver

      - name: Smoke test — xfce4-session present
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} which xfce4-session

      - name: Smoke test — Unity Hub present
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} which unityhub

      - name: Smoke test — Blender starts
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} blender --version

      - name: Smoke test — Obsidian retained
        run: docker run --rm ghcr.io/kethalia/hive-base:${{ github.sha }} which obsidian

      # Tag and push the already-built local image — no rebuild, no network fetches.
      # This guarantees what's in the registry is exactly what passed smoke tests.
      - name: Push image (main only, after smoke tests pass)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag ghcr.io/kethalia/hive-base:${{ github.sha }} ghcr.io/kethalia/hive-base:latest
          docker push ghcr.io/kethalia/hive-base:${{ github.sha }}
          docker push ghcr.io/kethalia/hive-base:latest

      - name: Resolve pushed image digest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: image
        run: |
          digest="sha256:$(docker buildx imagetools inspect "ghcr.io/kethalia/hive-base:${{ github.sha }}" --raw | sha256sum | awk '{print $1}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The Kubernetes template is digest-pinned. Updating it through a PR keeps
      # main user-merge-only while ensuring the newly tested image can roll out.
      - name: Open template image digest PR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          branch="automation/hive-base-${GITHUB_SHA:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Digest update branch already exists: $branch"
            exit 0
          fi

          sed -i -E \
            "s#ghcr.io/kethalia/hive-base@sha256:[0-9a-f]{64}#ghcr.io/kethalia/hive-base@${IMAGE_DIGEST}#g" \
            templates/ai-dev-k8s/main.tf

          git diff --exit-code -- templates/ai-dev-k8s/main.tf && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add templates/ai-dev-k8s/main.tf
          git commit -m "chore(template): update hive-base image digest"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(template): update hive-base image digest" \
            --body "Pins the Kubernetes workspace template to the hive-base image built and smoke-tested from commit ${GITHUB_SHA}."
