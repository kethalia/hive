name: Build workspace images

on:
  push:
    branches:
      - main
    paths:
      - "docker/hive-base/**"
      - "tools/workspace-identity/**"
      - ".github/workflows/build-base-image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docker/hive-base/**"
      - "tools/workspace-identity/**"
      - ".github/workflows/build-base-image.yml"
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish one reviewed cli preview image; no template activation
        required: false
        type: boolean
        default: false
      expected_source_sha:
        description: Exact full source SHA reviewed for this preview
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-workspace-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and smoke test (${{ matrix.variant }})
    if: (github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch')) && inputs.publish_preview != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cli, infrastructure, game, electronics, browser]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker/hive-base
          build-contexts: workspace-identity=./tools/workspace-identity
          push: false
          load: true
          platforms: linux/amd64
          build-args: WORKSPACE_VARIANT=${{ matrix.variant }}
          tags: ghcr.io/kethalia/hive-base:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=workspace-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=workspace-${{ matrix.variant }}

      - name: Smoke test image boundaries
        run: >-
          bash docker/hive-base/smoke-test.sh
          ghcr.io/kethalia/hive-base:${{ matrix.variant }}-${{ github.sha }}
          ${{ matrix.variant }}

  build-test-push:
    name: Build, smoke test, and push (${{ matrix.variant }})
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.publish_preview != true
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cli, infrastructure, game, electronics, browser]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load locally first so every pushed image is exactly what passed its
      # positive and negative capability smoke tests.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker/hive-base
          build-contexts: workspace-identity=./tools/workspace-identity
          push: false
          load: true
          platforms: linux/amd64
          build-args: WORKSPACE_VARIANT=${{ matrix.variant }}
          tags: ghcr.io/kethalia/hive-base:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=workspace-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=workspace-${{ matrix.variant }}

      - name: Smoke test image boundaries
        run: >-
          bash docker/hive-base/smoke-test.sh
          ghcr.io/kethalia/hive-base:${{ matrix.variant }}-${{ github.sha }}
          ${{ matrix.variant }}

      - name: Push tested image
        run: |
          image="ghcr.io/kethalia/hive-base:${{ matrix.variant }}-${{ github.sha }}"
          latest="ghcr.io/kethalia/hive-base:${{ matrix.variant }}-latest"
          docker tag "$image" "$latest"
          docker push "$image"
          docker push "$latest"

      - name: Resolve pushed image digest
        id: image
        run: |
          image="ghcr.io/kethalia/hive-base:${{ matrix.variant }}-${{ github.sha }}"
          digest="sha256:$(docker buildx imagetools inspect "$image" --raw | sha256sum | awk '{print $1}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-digests
          printf '%s\n' "$digest" > "image-digests/${{ matrix.variant }}.txt"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: workspace-image-digest-${{ matrix.variant }}
          path: image-digests/${{ matrix.variant }}.txt
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    name: Build and publish reviewed cli preview
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@v4
      - name: Verify reviewed source and absent public package tag
        run: |
          [[ "$GITHUB_REPOSITORY" == 'kethalia/hive' ]]
          [[ "$GITHUB_REF" == 'refs/heads/codex/delivery-system-design' ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          python3 tools/workspace-identity/preview-image.py absent
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build exact preview image locally
        uses: docker/build-push-action@v6
        with:
          context: docker/hive-base
          build-contexts: workspace-identity=./tools/workspace-identity
          push: false
          load: true
          platforms: linux/amd64
          build-args: WORKSPACE_VARIANT=cli
          tags: ghcr.io/kethalia/hive-base:preview-cli-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kethalia/hive
            io.hive.preview=true
          cache-from: type=gha,scope=workspace-cli
      - name: Smoke exact preview image
        run: |
          image="ghcr.io/kethalia/hive-base:preview-cli-${GITHUB_SHA}"
          bash docker/hive-base/smoke-test.sh "$image" cli
          docker run --rm "$image" cat /usr/local/libexec/hive-workspace-identity.json > /tmp/workspace-preview-helper.json
      - name: Log in to existing public GHCR package
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck absence and publish exact smoke-tested image
        run: |
          python3 tools/workspace-identity/preview-image.py absent
          docker push "ghcr.io/kethalia/hive-base:preview-cli-${GITHUB_SHA}"
      - name: Record exact source, registry digest and helper identity
        run: |
          image="ghcr.io/kethalia/hive-base:preview-cli-${GITHUB_SHA}"
          export EXPECTED_CONFIG_DIGEST="$(docker image inspect --format '{{.Id}}' "$image")"
          python3 tools/workspace-identity/preview-image.py published > /tmp/workspace-preview-proof.json
          {
            echo '### Reviewed cli preview image'
            echo 'No image alias, profile, template or workspace activation was changed.'
            echo '```json'
            cat /tmp/workspace-preview-proof.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  update-profile-digests:
    name: Open workspace image digest PR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.publish_preview != true
    needs: build-test-push
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: workspace-image-digest-*
          path: image-digests
          merge-multiple: true

      # Profiles stay digest-pinned while CLI, infrastructure, game, electronics, and browser
      # pods advance independently to the image that owns their capabilities.
      - name: Open workspace image digest PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cli_digest="$(cat image-digests/cli.txt)"
          infrastructure_digest="$(cat image-digests/infrastructure.txt)"
          game_digest="$(cat image-digests/game.txt)"
          electronics_digest="$(cat image-digests/electronics.txt)"
          browser_digest="$(cat image-digests/browser.txt)"
          for digest in "$cli_digest" "$infrastructure_digest" "$game_digest" "$electronics_digest" "$browser_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done

          replace_digest() {
            local digest=$1
            local expected_image="ghcr.io/kethalia/hive-base@${digest}"
            local profile
            shift
            sed -i -E \
              "s#ghcr.io/kethalia/hive-base@sha256:[0-9a-f]{64}#ghcr.io/kethalia/hive-base@${digest}#g" \
              "$@"
            for profile in "$@"; do
              jq -e --arg expected_image "$expected_image" \
                '.image == $expected_image' "$profile" >/dev/null
            done
          }

          promote_pending_image_variant() {
            local profile=$1
            local pending_variant
            local updated_profile
            if ! jq -e 'has("pending_image_variant")' "$profile" >/dev/null; then
              return
            fi
            pending_variant="$(jq -er \
              '.pending_image_variant | select(type == "string" and length > 0)' \
              "$profile")"
            updated_profile="$(jq --arg pending_variant "$pending_variant" \
              '.image_variant = $pending_variant | del(.pending_image_variant)' "$profile")"
            printf '%s\n' "$updated_profile" > "$profile"
          }

          cli_profiles=(
            templates/ai-dev-k8s/profile.json
          )
          infrastructure_profiles=(templates/infrastructure/profile.json)
          game_profiles=(templates/game-dev/profile.json)
          electronics_profiles=(templates/electronics/profile.json)
          browser_profiles=(templates/browser-testing/profile.json)

          replace_digest "$cli_digest" "${cli_profiles[@]}"
          replace_digest "$infrastructure_digest" "${infrastructure_profiles[@]}"
          promote_pending_image_variant "${infrastructure_profiles[0]}"
          replace_digest "$game_digest" "${game_profiles[@]}"
          replace_digest "$electronics_digest" "${electronics_profiles[@]}"
          replace_digest "$browser_digest" "${browser_profiles[@]}"

          profile_files=(
            "${cli_profiles[@]}"
            "${infrastructure_profiles[@]}"
            "${game_profiles[@]}"
            "${electronics_profiles[@]}"
            "${browser_profiles[@]}"
          )
          git diff --exit-code -- "${profile_files[@]}" && exit 0

          # Hive pushes these bundled profiles from its runtime image, so every
          # digest update must publish a new hive-web image containing them.
          changeset_file=".changeset/workspace-image-${GITHUB_SHA:0:12}.md"
          cat > "$changeset_file" <<'CHANGESET'
          ---
          "hive-web": patch
          ---

          Release the updated Kubernetes workspace image digests with the bundled Coder templates.
          CHANGESET

          branch="automation/workspace-images-${GITHUB_SHA:0:12}"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add "${profile_files[@]}" "$changeset_file"
            git commit -m "chore(template): update workspace image digests"
            git push origin "$branch"
          fi

          pr_data="$(gh pr list --head "$branch" --state all --json number,state,url --jq 'if length == 0 then "" else .[0] | [.number, .state, .url] | @tsv end')"
          if [ -z "$pr_data" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(template): update workspace image digests" \
              --body "Pins each Kubernetes workspace profile to the capability-specific image built and smoke-tested from commit ${GITHUB_SHA}.")"
          else
            IFS=$'\t' read -r pr_number pr_state pr_url <<< "$pr_data"
            if [ "$pr_state" = "CLOSED" ]; then
              gh pr reopen "$pr_number"
            elif [ "$pr_state" = "MERGED" ]; then
              echo "Digest update already merged: $pr_url"
              exit 0
            fi
          fi

          echo "Digest update PR: $pr_url"
          gh workflow run ci.yml --ref "$branch"
