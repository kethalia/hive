# Build images workflow — delegates to kethalia/workflows `build-stack.yml`,
# which owns matrix fan-out, and tag policy.
#
# Tag policy (per-service):
#   - always: ghcr.io/<owner>/<image>:sha-<short>
#   - on same-repo PR: + :pr-<num>-<sha>
#
# The :sha-<short> tag pushed on merge-to-main is the source for release.yml's
# retag-stack promotion (build-once / promote-on-release contract).
name: Build images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: kethalia/workflows/.github/workflows/build-stack.yml@v4
    secrets: inherit
    with:
      push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      # ECR's public mirror frequently returns 429s on GitHub-hosted runners.
      # Use the upstream official Node image for CI; Dockerfile defaults remain overridable.
      services: |
        [
          {"image": "hive-web", "dockerfile": "Dockerfile", "build-args": "NODE_IMAGE=docker.io/library/node:20-alpine"},
          {"image": "hive-terminal", "dockerfile": "services/terminal-proxy/Dockerfile", "build-args": "NODE_IMAGE=docker.io/library/node:20-alpine"},
          {"image": "hive-auth", "dockerfile": "services/auth/Dockerfile", "build-args": "NODE_IMAGE=docker.io/library/node:20-alpine"},
          {"image": "hive-migrate", "dockerfile": "services/migrate/Dockerfile", "build-args": "NODE_IMAGE=docker.io/library/node:20-alpine"}
        ]
