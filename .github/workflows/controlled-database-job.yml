# Invoke from a workflow_dispatch dispatcher pinned to this reviewed revision.
# Both the calling branch and this reusable workflow are pinned in the catalog.
name: Controlled database change
on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
    secrets:
      HIVE_DATABASE_URL:
        required: false
jobs:
  compatibility:
    if: ${{ vars.HIVE_DELIVERY_DATABASE_ENABLED == 'true' && inputs.operation == 'approve' }}
    name: fixed-database-compatibility-${{ vars.HIVE_DATABASE_COMPATIBILITY_DIGEST }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.HIVE_DATABASE_WORKFLOW_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test immutable images against isolated PostgreSQL
        env:
          TRUSTED_REVISION: ${{ vars.HIVE_DATABASE_WORKFLOW_SHA }}
          HIVE_DATABASE_COMPATIBILITY_CONFIG_JSON: ${{ vars.HIVE_DATABASE_COMPATIBILITY_CONFIG_JSON }}
          HIVE_DATABASE_COMPATIBILITY_DIGEST: ${{ vars.HIVE_DATABASE_COMPATIBILITY_DIGEST }}
        run: |
          [[ "$TRUSTED_REVISION" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$TRUSTED_REVISION" ]]
          node services/migrate/src/delivery/compatibility-job.mjs
  approval:
    if: ${{ vars.HIVE_DELIVERY_DATABASE_ENABLED == 'true' && inputs.operation == 'approve' }}
    needs: compatibility
    runs-on: ubuntu-latest
    environment: hive-database-change
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.HIVE_DATABASE_WORKFLOW_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Approve tested plan
        env:
          TRUSTED_REVISION: ${{ vars.HIVE_DATABASE_WORKFLOW_SHA }}
          HIVE_DELIVERY_DATABASE_ENABLED: ${{ vars.HIVE_DELIVERY_DATABASE_ENABLED }}
          HIVE_DELIVERY_DATABASE_CATALOG_JSON: ${{ vars.HIVE_DELIVERY_DATABASE_CATALOG_JSON }}
          HIVE_DELIVERY_DATABASE_APPROVAL_JSON: ${{ vars.HIVE_DELIVERY_DATABASE_APPROVAL_JSON }}
        run: |
          [[ "$TRUSTED_REVISION" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$TRUSTED_REVISION" ]]
          node services/migrate/src/delivery/approve-plan.mjs
  database:
    if: ${{ vars.HIVE_DELIVERY_DATABASE_ENABLED == 'true' && (inputs.operation == 'advance' || inputs.operation == 'activate') }}
    runs-on: ubuntu-latest
    environment: hive-database-change
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed job
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.HIVE_DATABASE_WORKFLOW_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run controlled operation
        env:
          OPERATION: ${{ inputs.operation }}
          TRUSTED_REVISION: ${{ vars.HIVE_DATABASE_WORKFLOW_SHA }}
          HIVE_DELIVERY_DATABASE_ENABLED: ${{ vars.HIVE_DELIVERY_DATABASE_ENABLED }}
          HIVE_DELIVERY_DATABASE_CATALOG_JSON: ${{ vars.HIVE_DELIVERY_DATABASE_CATALOG_JSON }}
          HIVE_DELIVERY_DATABASE_APPROVAL_JSON: ${{ vars.HIVE_DELIVERY_DATABASE_APPROVAL_JSON }}
          HIVE_DELIVERY_DATABASE_JOB_JSON: ${{ vars.HIVE_DELIVERY_DATABASE_JOB_JSON }}
          DATABASE_URL: ${{ secrets.HIVE_DATABASE_URL }}
        run: |
          [[ "$TRUSTED_REVISION" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$TRUSTED_REVISION" ]]
          case "$OPERATION" in
            advance) node services/migrate/src/delivery/installed-job.mjs ;;
            activate) HIVE_DELIVERY_DATABASE_JOB_MODE=activate node services/migrate/src/delivery/installed-job.mjs ;;
            *) exit 1 ;;
          esac
