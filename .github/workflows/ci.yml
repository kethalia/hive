# Deployment enrollment ref only. Publishing is hard-disabled for reachability proof.
name: Controlled native Preview publisher caller
on:
  workflow_dispatch:
    inputs:
      scope_json:
        description: Exact independently verified release/build/artifact selectors
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    # Remove only after protected ref/environment/credential/controller enrollment.
    if: ${{ false }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: kethalia/hive/.github/workflows/controlled-native-preview-publish.yml@7cdf06a8ab988a737c16eb69cf861c5acee97554
    with:
      scope-json: ${{ inputs.scope_json }}
    secrets:
      HIVE_NATIVE_RELEASE_CLOUDFLARE_TOKEN: ${{ secrets.HIVE_NATIVE_RELEASE_CLOUDFLARE_TOKEN }}
      HIVE_NATIVE_RELEASE_CONTROLLER_BEARER: ${{ secrets.HIVE_NATIVE_RELEASE_CONTROLLER_BEARER }}
