# Reusable workflow: an operator must pin this revision and enroll it on the controller.
# Candidate code has no access to the attestor job's OIDC token or preview bearer.
name: Controlled tested tree
on:
  workflow_call:
    secrets:
      HIVE_RELEASE_PREVIEW_BEARER:
        required: false
jobs:
  test:
    name: fixed-tested-tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact test merge parents
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$EXPECTED_BASE" =~ ^[a-f0-9]{40}$ && "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-list --parents -n 1 HEAD)" == "$GITHUB_SHA $EXPECTED_BASE $EXPECTED_HEAD" ]]
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
  attest:
    if: ${{ vars.HIVE_RELEASE_TESTED_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    environment: hive-release-test-attestation
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed attestor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.HIVE_RELEASE_TESTED_WORKFLOW_SHA }}
          path: trusted-attestor
          persist-credentials: false
      - name: Check out candidate as inert data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Attest exact tested tree
        env:
          HIVE_TESTED_CANDIDATE_DIR: ${{ github.workspace }}/candidate
          HIVE_RELEASE_TESTED_CONFIG_JSON: ${{ vars.HIVE_RELEASE_TESTED_CONFIG_JSON }}
          HIVE_RELEASE_PREVIEW_BEARER: ${{ secrets.HIVE_RELEASE_PREVIEW_BEARER }}
          TRUSTED_REVISION: ${{ vars.HIVE_RELEASE_TESTED_WORKFLOW_SHA }}
        run: |
          [[ "$TRUSTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git -C trusted-attestor rev-parse HEAD)" == "$TRUSTED_REVISION" ]]
          node <<'NODE'
          const u = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          if (u.protocol !== 'https:' || !u.hostname.endsWith('.actions.githubusercontent.com') || u.username || u.password) process.exit(1);
          u.searchParams.set('audience', 'urn:hive:tested-revision-check');
          const r = await fetch(u, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }, redirect: 'error', signal: AbortSignal.timeout(10000) });
          if (!r.ok) process.exit(1);
          const j = await r.json(), parts = j.value?.split('.');
          if (parts?.length !== 3 || parts[1].length > 12000) process.exit(1);
          const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
          if (claims.job_workflow_sha !== process.env.TRUSTED_REVISION) process.exit(1);
          NODE
          node "$GITHUB_WORKSPACE/trusted-attestor/scripts/release/tested-attestor.mjs"
