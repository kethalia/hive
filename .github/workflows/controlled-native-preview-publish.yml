# Reusable only. Enroll a reachable trusted workflow_dispatch/workflow_run caller
# pinned to the reviewed SHA; this unmerged file is not a default-branch listener.
name: Controlled native Preview publication
on:
  workflow_call:
    inputs:
      scope-json:
        description: "Release and completed builder selectors; independently verified before effects"
        required: true
        type: string
    secrets:
      HIVE_NATIVE_RELEASE_CLOUDFLARE_TOKEN:
        description: "Explicitly mapped protected environment write credential"
        required: true
      HIVE_NATIVE_RELEASE_CONTROLLER_BEARER:
        description: "Optional controller transport credential"
        required: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.HIVE_NATIVE_RELEASE_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: hive-native-release
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out only the operator-reviewed publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.HIVE_NATIVE_RELEASE_PUBLISHER_SHA }}
          path: trusted-publisher
          persist-credentials: false
      - name: Verify publisher checkout and reusable workflow identity
        working-directory: trusted-publisher
        env:
          PUBLISHER_SHA: ${{ vars.HIVE_NATIVE_RELEASE_PUBLISHER_SHA }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$PUBLISHER_SHA" ]]
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          if (url.protocol !== 'https:' || url.port || url.username || url.password || !url.hostname.endsWith('.actions.githubusercontent.com')) throw Error('publisher_identity');
          url.searchParams.set('audience', 'urn:hive:native-publisher-revision-check');
          const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }, redirect: 'error', signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw Error('publisher_identity');
          const result = await response.json();
          const parts = result.value?.split('.');
          if (parts?.length !== 3 || parts[1].length > 12000) throw Error('publisher_identity');
          const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
          if (claims.job_workflow_sha !== process.env.PUBLISHER_SHA) throw Error('publisher_identity');
          NODE
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          package_json_file: trusted-publisher/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install reviewed dependencies without lifecycle scripts
        working-directory: trusted-publisher
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify completed artifact, obtain one-use grant and publish inert bytes
        working-directory: trusted-publisher
        env:
          HIVE_NATIVE_RELEASE_PUBLISH_ENABLED: ${{ vars.HIVE_NATIVE_RELEASE_PUBLISH_ENABLED }}
          HIVE_NATIVE_RELEASE_PUBLISH_CONFIG_JSON: ${{ vars.HIVE_NATIVE_RELEASE_PUBLISH_CONFIG_JSON }}
          HIVE_NATIVE_RELEASE_SCOPE_JSON: ${{ inputs.scope-json }}
          GITHUB_TOKEN: ${{ github.token }}
          HIVE_NATIVE_RELEASE_CLOUDFLARE_TOKEN: ${{ secrets.HIVE_NATIVE_RELEASE_CLOUDFLARE_TOKEN }}
          HIVE_NATIVE_RELEASE_CONTROLLER_BEARER: ${{ secrets.HIVE_NATIVE_RELEASE_CONTROLLER_BEARER }}
        run: pnpm exec tsx scripts/release/native-preview-publisher.ts
